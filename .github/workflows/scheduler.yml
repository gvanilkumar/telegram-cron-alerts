name: Telegram Cron Alerts

on:
  schedule:
    # Run every 5 minutes (GitHub Actions schedule resolution limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Allows the workflow to push state.json and logs/ back to the repo

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Alert Scheduler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CUSTOM_API_ENDPOINT: ${{ secrets.CUSTOM_API_ENDPOINT }}
          CUSTOM_AI_MODEL: ${{ secrets.CUSTOM_AI_MODEL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: node runner.js

      - name: Commit and Push state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage state.json to detect actual alert updates
          git add state.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Runner: Sync state [skip ci]"
            
            MAX_RETRIES=5
            COUNT=0
            SUCCESS=0
            
            while [ $COUNT -lt $MAX_RETRIES ]; do
              git stash --include-untracked || true
              if git pull --rebase -X theirs origin main; then
                git stash pop || true
                if git push origin HEAD:${{ github.ref }}; then
                  SUCCESS=1
                  break
                fi
              fi
              git rebase --abort || true
              git stash pop || true
              COUNT=$((COUNT+1))
              echo "Git push race condition detected. Retrying ($COUNT/$MAX_RETRIES)..."
              sleep 2
            done
            
            if [ $SUCCESS -eq 0 ]; then
              echo "Failed to push state updates after $MAX_RETRIES retries."
              exit 1
            fi
          else
            echo "No alert state changes. Skipping Git commit to prevent history bloat."
          fi
