name: Telegram Cron Alerts

on:
  schedule:
    # Run every 5 minutes (GitHub Actions schedule resolution limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Allows the workflow to push state.json and logs/ back to the repo

jobs:
  run-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Alert Scheduler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CUSTOM_API_ENDPOINT: ${{ secrets.CUSTOM_API_ENDPOINT }}
          CUSTOM_AI_MODEL: ${{ secrets.CUSTOM_AI_MODEL }}
        run: node runner.js

      - name: Commit and Push state & logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create logs directory if it doesn't exist to avoid git add errors
          mkdir -p logs
          
          # Stage state.json to detect actual alert updates (success or error)
          git add state.json
          
          # Only commit and push if state.json has actual updates
          if ! git diff --cached --quiet; then
            # Stage the logs history as well so they sync together
            git add logs/
            git commit -m "Runner: Sync state and logs [skip ci]"
            # Pull and rebase from remote first in case new tasks were configured during execution
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref }}
          else
            echo "No alert state changes. Skipping Git commit to prevent history bloat."
          fi
